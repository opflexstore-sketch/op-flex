name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you manually re-deploy from the Actions tab (re-syncs product data too)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: wtflex-react/package-lock.json

      - name: Install dependencies
        working-directory: wtflex-react
        run: npm ci

      # Downloads all product images + JSON into public/assets & public/data
      - name: Sync product data & images from wtflex.in
        working-directory: wtflex-react
        run: npm run sync

      - name: Build (Vite)
        working-directory: wtflex-react
        env:
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAILJS_ORDER_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_ORDER_TEMPLATE_ID }}
          VITE_ADMIN_EMAIL: ${{ secrets.VITE_ADMIN_EMAIL }}
          VITE_UPI_ID: ${{ secrets.VITE_UPI_ID }}
          VITE_UPI_PAYEE_NAME: ${{ secrets.VITE_UPI_PAYEE_NAME }}
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wtflex-react/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
